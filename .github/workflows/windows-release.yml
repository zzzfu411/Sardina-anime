name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows.*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build installer and ZIP
        run: pnpm package:win
      - name: Verify packaged desktop without Node on PATH
        run: pnpm verify:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            docs/validation/*-win32-x64.json
            output/playwright/desktop-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*-windows-x64-setup.exe
            release/*-windows-x64.zip
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Publish Windows development preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --prerelease \
            --title "$RELEASE_TAG · Windows 开发预览" \
            --notes-file docs/WINDOWS-RELEASE.md
